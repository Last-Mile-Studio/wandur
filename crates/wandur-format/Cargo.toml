[package]
name = "wandur-format"
description = "Formats world scripts for display in the Wandur script editor (JavaScript through Biome's formatter). Loaded on first use."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["javascript"]
# JavaScript formatting with Biome's formatter (MIT OR Apache-2.0, pure Rust, Prettier's style).
# Without it nothing is formatted and scripts are shown as stored.
javascript = [
    "dep:biome_js_formatter",
    "dep:biome_js_parser",
    "dep:biome_js_syntax",
    "dep:biome_formatter",
    "dep:biome_console",
    "dep:biome_diagnostics",
    "dep:biome_parser",
    "dep:biome_rowan",
    "dep:biome_text_edit",
    "dep:biome_text_size",
    "dep:biome_unicode_table",
]

[dependencies]
biome_js_formatter = { version = "=0.5.7", optional = true }
biome_js_parser = { version = "=0.5.7", optional = true }
biome_js_syntax = { version = "=0.5.7", optional = true }
biome_formatter = { version = "=0.5.7", optional = true }
# Biome stopped publishing to crates.io at 0.5.7, and some of its own crates later got 0.5.8 and
# 0.5.9 releases that do not build with the 0.5.7 formatter. Naming them here at exactly 0.5.7 keeps
# the resolver on the set that was released together. They are not used directly.
biome_console = { version = "=0.5.7", optional = true }
biome_diagnostics = { version = "=0.5.7", optional = true }
biome_parser = { version = "=0.5.7", optional = true }
biome_rowan = { version = "=0.5.7", optional = true }
biome_text_edit = { version = "=0.5.7", optional = true }
biome_text_size = { version = "=0.5.7", optional = true }
biome_unicode_table = { version = "=0.5.7", optional = true }

[lints]
workspace = true
